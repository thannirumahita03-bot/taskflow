version: "3.9"

services:

  mongodb:
    image: mongo:8
    container_name: taskflow-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend

    container_name: taskflow-backend

    ports:
      - "8000:8000"

    environment:
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: my-secret-key

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend

    container_name: taskflow-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  mongo_data: